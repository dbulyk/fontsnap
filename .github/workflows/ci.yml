name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the previous run; main and tag runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A project .npmrc (script-shell=true, ignore-scripts, ...) can turn every `npm run` into a
      # no-op, including the tests that would notice it, so this is checked by the shell, not by npm.
      - name: No project .npmrc
        run: test ! -e .npmrc
      # Only the LFS files this job reads (the quota for LFS traffic is small), cached between runs.
      - uses: ./.github/actions/lfs-pull
        with:
          include: data/realset3/images/**
          token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:locales
      - run: npm run check:version

  e2e:
    name: E2E (Chromium, headed under xvfb)
    runs-on: ubuntu-latest
    # Cache-hit path still runs `playwright install-deps` (~11 min on ubuntu-latest).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A project .npmrc (script-shell=true, ignore-scripts, ...) can turn every `npm run` into a
      # no-op, including the tests that would notice it, so this is checked by the shell, not by npm.
      - name: No project .npmrc
        run: test ! -e .npmrc
      # Only the LFS files this job reads (the quota for LFS traffic is small), cached between runs.
      - uses: ./.github/actions/lfs-pull
        with:
          include: model/model_fp16.onnx,data/realset3/images/**
          token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read Playwright version from the lockfile
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies only (browser restored from cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Xvfb must run with -noreset (see the script): otherwise it resets after the last browser
      # closes and rejects the next launch with "Missing X server or $DISPLAY".
      - run: npm run test:e2e:xvfb
      - name: Show Xvfb log
        if: failure()
        run: cat xvfb.log || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            xvfb.log
          if-no-files-found: ignore
          retention-days: 7

  # The Python reference pipeline, the model regression on realset3 (thresholds in tests/thresholds.json, overridable
  # with the repository variables of the same names) and the JS/Python parity of the TypeScript pipeline.
  reference:
    name: Python reference, model regression and parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A project .npmrc (script-shell=true, ignore-scripts, ...) can turn every `npm run` into a
      # no-op, including the tests that would notice it, so this is checked by the shell, not by npm.
      - name: No project .npmrc
        run: test ! -e .npmrc
      # Only the LFS files this job reads (the quota for LFS traffic is small), cached between runs.
      - uses: ./.github/actions/lfs-pull
        with:
          include: model/model_fp16.onnx,data/realset3/images/**
          token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: npm ci
      - run: pip install -r python/requirements.txt
      - name: Lint Python (ruff)
        run: ruff check . && ruff format --check python tests
      - name: Unit tests (Python, pytest)
        run: python -m pytest -q
      - name: Python reference eval on realset3
        working-directory: python
        run: python -m fontsnap_ref.evaluate --out ../out/py_realset3.json
      - name: Model regression and JS/Python parity (realset3)
        env:
          FONTSNAP_MIN_BEST_TOP1: ${{ vars.FONTSNAP_MIN_BEST_TOP1 }}
          FONTSNAP_MIN_BEST_TOP5: ${{ vars.FONTSNAP_MIN_BEST_TOP5 }}
          FONTSNAP_MIN_BARE_TOP1: ${{ vars.FONTSNAP_MIN_BARE_TOP1 }}
          FONTSNAP_MIN_BARE_TOP5: ${{ vars.FONTSNAP_MIN_BARE_TOP5 }}
          FONTSNAP_MIN_PARITY: ${{ vars.FONTSNAP_MIN_PARITY }}
        run: npm run test:regression
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fontsnap-results
          path: out/*.json
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and zip
    needs: [checks, e2e, reference]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A project .npmrc (script-shell=true, ignore-scripts, ...) can turn every `npm run` into a
      # no-op, including the tests that would notice it, so this is checked by the shell, not by npm.
      - name: No project .npmrc
        run: test ! -e .npmrc
      # Only the LFS files this job reads (the quota for LFS traffic is small), cached between runs.
      - uses: ./.github/actions/lfs-pull
        with:
          include: model/model_fp16.onnx
          token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:version
      - run: npm run zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # Read-only job: compares the tag with the manifest inside the zip that was built, using the
  # unit-tested scripts/check-tag.ts. Kept apart so the write-privileged release job installs nothing.
  verify-tag:
    name: Verify tag matches the version
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A project .npmrc (script-shell=true, ignore-scripts, ...) can turn every `npm run` into a
      # no-op, including the tests that would notice it, so this is checked by the shell, not by npm.
      - name: No project .npmrc
        run: test ! -e .npmrc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: release
      - run: npx tsx scripts/check-tag.ts "$GITHUB_REF_NAME" release

  # Provenance for the zip that is published. Attestations need a public repository (or GitHub
  # Enterprise Cloud), so on a private repository this job is opt-in: set the repository variable
  # ENABLE_ATTESTATIONS to 'true'. It is a separate job so that the OIDC token and the attestation
  # permission exist only where they are used, and the release job keeps contents: write alone.
  attest:
    name: Attest build provenance
    needs: [build, verify-tag]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && (github.event.repository.visibility == 'public' || vars.ENABLE_ATTESTATIONS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: release
      - name: Verify the checksum of the downloaded zip
        working-directory: release
        run: sha256sum -c ./*.zip.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

  release:
    name: Publish GitHub release
    # Waits for attest, which is skipped on a private repository without ENABLE_ATTESTATIONS: a skipped
    # attest does not stop the release, a failed one does (no release without the provenance promised).
    needs: [build, verify-tag, attest]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.verify-tag.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.attest.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with write access. It checks out nothing and installs nothing.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: release
      - name: Verify the checksum of the downloaded zip
        working-directory: release
        run: sha256sum -c ./*.zip.sha256
      - name: Publish the zip and its checksum as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.zip.sha256
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
